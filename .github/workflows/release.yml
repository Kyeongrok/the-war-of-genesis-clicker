name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # 태그 없이 손으로 돌리면 릴리즈는 안 만들고 exe 를 Actions 산출물로만 올린다.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d') { $tag = 'v0.0.0' }
          $version = $tag.TrimStart('v')
          $parts = $version.Split('.')
          while ($parts.Count -lt 3) { $parts += '0' }
          $version = $parts -join '.'
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # 게임(DuelDx.exe)과 에디터(WarOfGenesis.Editor.exe)를 각각 설치 없이 도는 단일 exe 로 낸다.
      # IncludeAllContentForSelfExtract — csproj 가 싣는 assets 폴더(캐릭터·배경)까지 exe 안에 묶는다.
      - name: Publish (game, editor)
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          foreach ($proj in 'duel-dx/DuelDx.csproj', 'WarOfGenesis.Editor/WarOfGenesis.Editor.csproj') {
            dotnet publish $proj -c Release -r win-x64 --self-contained true -o publish `
              -p:PublishSingleFile=true `
              -p:IncludeAllContentForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true `
              -p:DebugType=none `
              -p:Version=$v -p:AssemblyVersion=$v -p:FileVersion=$v -p:InformationalVersion=$v
            if ($LASTEXITCODE -ne 0) { throw "$proj publish 실패" }
          }
          foreach ($exe in 'DuelDx.exe', 'WarOfGenesis.Editor.exe') {
            if (-not (Test-Path "publish/$exe")) { throw "publish 에 $exe 가 없습니다" }
          }
          Get-ChildItem publish | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-war-of-genesis-${{ steps.version.outputs.version }}
          path: publish/*.exe

      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag publish/DuelDx.exe publish/WarOfGenesis.Editor.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
