name = "war-of-genesis-stats"
main = "src/index.js"
compatibility_date = "2026-10-01"

# `wrangler d1 create war-of-genesis-stats` 가 찍어 주는 database_id 를 아래에 넣는다.
[[d1_databases]]
binding = "DB"
database_name = "war-of-genesis-stats"
database_id = "6652a8b9-c5af-4c32-a0e9-3c4c86a175f3"

# 용의기사2 리메이크의 버그 리포트(fd2-remake/tools/bug-worker) — 대시보드 버그 리포트 탭이 같이 읽고 상태를 바꾼다.
[[d1_databases]]
binding = "FD2_DB"
database_name = "fd2-remake"
database_id = "9640048b-c93d-4108-9ce1-d38fb4722c08"
